services:
  api:
    build:
      context: /share/Container/server-project/server
      args:
        PYTHON_IMAGE: qa5ekf6duk4yz2es0q.xuanyuan.run/library/python:3.12-slim
    environment:
      APP_NAME: openpilot-local-server
      APP_ENV: production
      APP_SECRET: CHANGE-THIS-APP-SECRET
      POSTGRES_PASSWORD: CHANGE-THIS-DB-PASSWORD
      DATABASE_URL: postgresql+psycopg://openpilot:CHANGE-THIS-DB-PASSWORD@postgres:5432/openpilot
      STORAGE_ROOT: /srv/openpilot-storage
      UPLOAD_TOKEN_TTL_SECONDS: "900"
      MAX_UPLOAD_BYTES: "2147483648"
      VIDEO_STORAGE_LIMIT_BYTES: "85899345920"
      LOG_RETENTION_DAYS: "60"
      CLEANUP_INTERVAL_SECONDS: "3600"
      FFMPEG_ENABLED: "1"
      VIDEO_FPS: "20"
      LOCAL_ENROLL_CODE: CHANGE-THIS-ENROLL-CODE
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: CHANGE-THIS-ADMIN-PASSWORD
      APP_TOKEN_TTL_SECONDS: "86400"
      JWT_CLOCK_SKEW_SECONDS: "5"
      DIAGNOSTICS_TOKEN: CHANGE-THIS-DIAGNOSTICS-TOKEN
      LOG_LEVEL: INFO
      ATHENA_PATH_PREFIX: /ws/v2
      # Must be reachable from the openpilot device. Do not leave NAS_IP here.
      PUBLIC_BASE_URL: http://192.168.5.3:18080
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - /share/Container/server-project/storage:/srv/openpilot-storage
      # NAS 部署时直接使用主机上的应用源码，网页/Python 修改后重启 API 即可生效；
      # 依赖或 Dockerfile 修改时仍需重新构建镜像。
      - /share/Container/server-project/server/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  postgres:
    image: qa5ekf6duk4yz2es0q.xuanyuan.run/library/postgres:16
    environment:
      POSTGRES_DB: openpilot
      POSTGRES_USER: openpilot
      POSTGRES_PASSWORD: CHANGE-THIS-DB-PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpilot -d openpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    profiles: ["https"]
    image: qa5ekf6duk4yz2es0q.xuanyuan.run/library/caddy:2-alpine
    environment:
      SERVER_DOMAIN: localhost
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - /share/Container/server-project/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
